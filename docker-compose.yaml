services:

  deckoviz_ai:
    build: .
    container_name: deckoviz_ai
    image: deckoviz_ai
    env_file:
      - .env
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8082", "--reload", "--timeout-keep-alive", "300", "--timeout-graceful-shutdown", "30"]
    ports:
      - "8082:8082"
    volumes:
      - .:/app
    networks:
      - decoviz_common_default
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped


  celery_worker_deckoviz_ai:
    container_name: deckoviz_ai_celery_worker
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    image: celery_worker:latest
    command: celery -A core.celery.celery_app worker --loglevel=info
    depends_on:
      - deckoviz_ai
    networks:
      - decoviz_common_default
    volumes:
      - ./:/app 

  celery_beat_deckoviz_ai:
    container_name: deckoviz_ai_celery_beat
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    image: celery_beat:latest
    command: celery -A core.celery.celery_app beat --loglevel=info
    depends_on:
      - deckoviz_ai
    networks:
      - decoviz_common_default
    volumes:
      - ./:/app 
networks:
  decoviz_common_default: 
    external: true
    name: python_deckoviz_decoviz_common_default
