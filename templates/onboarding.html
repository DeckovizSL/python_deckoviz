<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deckoviz AI Onboarding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 800px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .status-indicator {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            position: relative;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e1e5e9;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 5px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 12px 18px;
            background: white;
            border-radius: 18px;
            border: 1px solid #e1e5e9;
            margin-bottom: 15px;
        }

        .typing-dots {
            display: flex;
            gap: 3px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e1e5e9;
        }

        .chat-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input input:focus {
            border-color: #667eea;
        }

        .send-button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .send-button:hover {
            background: #5a6fd8;
        }

        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .voice-call-prompt {
            background: #e8f5e8;
            border: 1px solid #4caf50;
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
            text-align: center;
        }

        .voice-call-button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
        }

        .voice-call-button:hover {
            background: #45a049;
        }
        
        .step-indicator {
            padding: 10px;
            background: #f0f4ff;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #4a5568;
        }
        
        .phone-input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }
        
        .phone-input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Welcome to Deckoviz AI Onboarding</h1>
            <div class="status-indicator">Starting your personalized experience...</div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <!-- Messages will appear here -->
        </div>
        
        <div class="chat-input-container">
            <div class="step-indicator" id="stepIndicator">Step: Initializing...</div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type your message..." disabled>
                <button class="send-button" id="sendButton" disabled>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || 'user_' + Date.now();
        let sessionId = null;
        let socket = null;
        
        // Elements
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const stepIndicator = document.getElementById('stepIndicator');
        const statusIndicator = document.querySelector('.status-indicator');
        
        // Initialize onboarding
        async function initializeOnboarding() {
            try {
                statusIndicator.textContent = 'Starting session...';
                
                // Start onboarding session
                const response = await fetch(`/onboarding/start-onboarding-api?user_id=${userId}`);
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                    return;
                }
                
                sessionId = data.session_id;
                statusIndicator.textContent = 'Connected';
                
                // Enable input
                messageInput.disabled = false;
                sendButton.disabled = false;
                
                // Connect WebSocket
                connectWebSocket();
                
            } catch (error) {
                showError('Failed to start onboarding: ' + error.message);
            }
        }
        
        // Connect WebSocket
        function connectWebSocket() {
            if (!sessionId) return;
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/onboarding/ws/${sessionId}`;
            
            socket = new WebSocket(wsUrl);
            
            socket.onopen = () => {
                console.log('WebSocket connected');
                statusIndicator.textContent = 'Connected';
            };
            
            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'message') {
                    addMessage('bot', data.content);
                    stepIndicator.textContent = `Step: ${data.step}`;
                }
                else if (data.type === 'voice_call_ready') {
                    showVoiceCallPrompt();
                }
                else if (data.type === 'voice_call_initiated') {
                    addMessage('bot', 'Voice call initiated! Please answer your phone.');
                }
                else if (data.type === 'session_complete') {
                    addMessage('bot', data.message);
                    messageInput.disabled = true;
                    sendButton.disabled = true;
                    statusIndicator.textContent = 'Completed';
                }
                else if (data.type === 'error') {
                    showError(data.message);
                }
            };
            
            socket.onclose = () => {
                console.log('WebSocket disconnected');
                statusIndicator.textContent = 'Disconnected';
            };
            
            socket.onerror = (error) => {
                console.error('WebSocket error:', error);
                statusIndicator.textContent = 'Connection error';
            };
        }
        
        // Add message to chat
        function addMessage(type, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.textContent = content;
            
            const messageTime = document.createElement('div');
            messageTime.className = 'message-time';
            messageTime.textContent = new Date().toLocaleTimeString();
            
            messageContent.appendChild(messageTime);
            messageDiv.appendChild(messageContent);
            chatMessages.appendChild(messageDiv);
            
            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Show voice call prompt
        function showVoiceCallPrompt() {
            const promptDiv = document.createElement('div');
            promptDiv.className = 'voice-call-prompt';
            promptDiv.innerHTML = `
                <p>Would you like to schedule a voice call to complete your onboarding?</p>
                <div class="phone-input-container">
                    <input type="tel" id="phoneInput" class="phone-input" placeholder="Enter your phone number">
                    <button class="voice-call-button" id="scheduleCallButton">Schedule Call</button>
                </div>
            `;
            
            chatMessages.appendChild(promptDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            document.getElementById('scheduleCallButton').addEventListener('click', () => {
                const phoneNumber = document.getElementById('phoneInput').value;
                if (!phoneNumber) {
                    alert('Please enter a valid phone number');
                    return;
                }
                
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: 'request_voice_call',
                        phone: phoneNumber
                    }));
                    
                    // Remove prompt
                    promptDiv.remove();
                    
                    // Add message
                    addMessage('user', `Requesting voice call to: ${phoneNumber}`);
                }
            });
        }
        
        // Show error
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'message bot';
            errorDiv.style.color = 'red';
            
            const errorContent = document.createElement('div');
            errorContent.className = 'message-content';
            errorContent.textContent = `Error: ${message}`;
            
            errorDiv.appendChild(errorContent);
            chatMessages.appendChild(errorDiv);
        }
        
        // Send message
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !socket || socket.readyState !== WebSocket.OPEN) return;
            
            // Send message to WebSocket
            socket.send(JSON.stringify({
                type: 'message',
                content: message
            }));
            
            // Add to chat
            addMessage('user', message);
            
            // Clear input
            messageInput.value = '';
        }
        
        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });
        
        // Initialize when page loads
        window.addEventListener('load', initializeOnboarding);
    </script>
</body>
</html>
